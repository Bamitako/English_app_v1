name: アプリを公開する

on:
  push:
    branches: [claude/notion-requirements-connection-dyqkli]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に次の公開が始まっても、後から始まったほうを待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages では https://<ユーザー名>.github.io/<リポジトリ名>/ に置かれるため、
      # その階層をビルド時に伝える。
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
