name: アプリを公開する

on:
  push:
    branches: [claude/notion-requirements-connection-dyqkli]
  # 画像取得が終わったあとに公開しないと、画像のない状態が公開されてしまう。
  # 取得ワークフローのコミットは GITHUB_TOKEN によるもので push では起動しないため、
  # 完了イベントを拾う。
  workflow_run:
    workflows: ['単語の画像を取得する']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に次の公開が始まっても、後から始まったほうを待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 画像取得が失敗したときまで公開し直さない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run から起動したときは、取得ワークフローがコミットした最新を取りに行く。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages では https://<ユーザー名>.github.io/<リポジトリ名>/ に置かれるため、
      # その階層をビルド時に伝える。
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Pages の有効化はリポジトリの Settings から一度だけ手動で行う。
      # ワークフローのトークンには作成権限がないため、ここでは設定を読むだけ。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
